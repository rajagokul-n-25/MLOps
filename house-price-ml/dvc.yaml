stages:
  ingest:
    cmd: python -m src.ingest
    deps:
      - src/ingest.py
    params:
      - ingest.table_name
    outs:
      - data/house-prices.csv

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - data/house-prices.csv
    params:
      - train.test_size
      - train.random_state
      - train.r2_threshold
      - train.mae_threshold

