services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-s3
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API Endpoint (for DVC, MLflow, AWS CLI)
      - "9001:9001"   # Web Console Dashboard UI
    environment:
      - RUST_LOG=info
    command: >
      --access-key "admin"
      --secret-key "admin@123"
      --address :9000
      --console-enable
      /data
    volumes:
      - rustfs_data:/data

volumes:
  rustfs_data:
    name: rustfs_data
